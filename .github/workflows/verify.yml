name: verify

# 紙面に印字した数を、それを出した台本を回して確かめる。
# 台本は四つの組に分けて並行に回す。出力は expected/ と一字一句で突き合わせる。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: scripts (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [curve, edges, symbolic, symbolic-referee, trinity]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python verification/run_scripts.py ${{ matrix.group }}

  # check_text.py は CITATION.cff の version を最新のタグと比べるので、タグも取る。
  text-and-numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-tags: true }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python verification/check_text.py
      - run: python verification/check_text.py --break
      - run: python verification/check_numbers.py
      - run: python verification/check_numbers.py --break
      - run: python verification/check_copies.py
      - run: python verification/check_copies.py --break

  # 二つ目の稿（continuity/）。台本を回して continuity/expected/ と一字一句で比べ、紙面の数と突き合わせる。
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python verification/run_scripts.py continuity
      - run: python verification/check_numbers_continuity.py
      - run: python verification/check_numbers_continuity.py --break

  # Figshare に置く五つの品（figshare/）。作り直して一字一句比べ、CSV を expected/ と、文面の語と数を確かめる。
  # 台本の束は固定した commit の git archive なので、履歴を全部取る。PDF は TeX Live で組み直す。
  figshare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended lmodern poppler-utils
      - run: python -m pip install -r requirements.txt
      - run: python verification/check_figshare.py --rebuild
      - run: python verification/check_figshare.py --break
