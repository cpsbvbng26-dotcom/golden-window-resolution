name: verify

# 紙面に印字した数を、それを出した台本を回して確かめる。
# 台本は四つの組に分けて並行に回す。出力は expected/ と一字一句で突き合わせる。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: scripts (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [curve, edges, symbolic, symbolic-referee]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python verification/run_scripts.py ${{ matrix.group }}

  text-and-numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python verification/check_text.py
      - run: python verification/check_text.py --break
      - run: python verification/check_numbers.py
      - run: python verification/check_numbers.py --break
      - run: python verification/check_copies.py
